name: CI

on:
  push:
  pull_request:

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generates the gitignored expo-router typed-routes files
      # (expo-env.d.ts + .expo/types/router.d.ts) that tsconfig includes.
      - name: Generate typed routes
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Test
        run: npm test -- --ci
